<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8b4b1f"><title>งานช่างสุพรรณเบญจรงค์</title>
<link rel="manifest" href="./manifest.webmanifest?v=worker-manifest-v2"><link rel="icon" href="../assets/worker-app-icon.png" type="image/png"><link rel="apple-touch-icon" href="../assets/worker-app-icon.png"><link rel="stylesheet" href="./worker.css"><link rel="stylesheet" href="../css/loader.css?v=loader-v2"><link rel="stylesheet" href="./worker-save-feedback.css?v=save-v1">
<style>
  /* Keep the layout at its designed size: ignore the phone's browser text
     scaling (it made text huge and broke the cards), and shrink the whole
     page a little on phones whose display-size setting leaves a very narrow screen. */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  @media(max-width:359px){body{zoom:.9}}
  @media(max-width:330px){body{zoom:.82}}
  /* tokens the shared loader (../css/loader.css) expects from the main app */
  :root{--font:Prompt,Sarabun,system-ui,sans-serif;--primary-dark:#086453;--text-muted:#5f726a;--border:#cfd8d4;--shadow:0 4px 14px #0002}
  /* big "new version" bar: workers must notice it and press the button */
  #update-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;gap:7px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:#086453;color:#fff;box-shadow:0 -8px 28px #0006;text-align:center}
  #update-bar b{font-size:21px}#update-bar span{font-size:15px;line-height:1.45}#update-bar small{font-size:13px;opacity:.9}
  #update-bar button{min-height:68px;border:0;border-radius:16px;background:#ffc93c;color:#3b2a00;font-size:22px;font-weight:800;animation:update-pulse 1.4s ease-in-out infinite}
  @keyframes update-pulse{50%{transform:scale(1.03);box-shadow:0 0 0 9px #ffc93c55}}
  body.has-update .page{padding-bottom:270px}
  /* job the owner sent back for correction */
  .card.job.returned{border:2px solid #c62828;background:#fff8f7}
  .return-alert{display:grid;gap:6px;margin-bottom:12px;padding:12px;border-radius:12px;background:#c62828;color:#fff}
  .return-alert b{font-size:18px;line-height:1.35}.return-alert span{padding:9px 11px;border-radius:9px;background:#fff;color:#8e1b1b;font-size:17px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}.return-alert small{font-size:13px;line-height:1.45}
  .badge.fix{background:#c62828;color:#fff;font-weight:800}
  .fix-heading h2{color:#c62828}
  .tab-dot{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:5px;padding:0 6px;border-radius:999px;background:#c62828;color:#fff;font-size:13px;font-weight:800;font-style:normal;line-height:1;vertical-align:middle}
  .history-reason{display:block;margin-top:3px;color:#c62828;font-size:13px;font-weight:700;font-style:normal;overflow-wrap:anywhere}.history-reason.cancelled{color:#78827e}
  .worker-history-row strong.fix{color:#c62828}.worker-history-row strong.cancelled{color:#78827e}
  .pin input::placeholder{letter-spacing:1px;font-size:17px}.pin input+input{margin-top:10px}
  .confirm-modal{width:min(100%,420px);padding:24px;border-radius:20px;background:#fff;box-shadow:0 24px 58px #052d2640}
  .confirm-modal h2{margin:0;color:#086453;font-size:22px}.confirm-modal p{margin:10px 0 20px;line-height:1.55;color:#4d5b55}
  .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.confirm-actions button{min-height:48px;border-radius:12px;font-weight:800}
  .confirm-actions #ask-cancel{border:1px solid #b9cbc4;background:#fff;color:#086453}.confirm-actions #ask-ok{border:0;background:#086453;color:#fff}
  .worker-loading-card{text-align:center;padding:34px 20px}.worker-loading-card h2{margin:18px 0 6px;color:#086453;font-size:22px}.worker-spinner{display:inline-block;width:54px;height:54px;border:5px solid #d7e9e1;border-top-color:#086453;border-radius:50%;animation:worker-spin .8s linear infinite}.worker-loading-steps{display:grid;gap:7px;margin:20px auto 0;max-width:260px;text-align:left;color:#5f726a;font-size:14px}.worker-loading-steps span:first-child{color:#086453;font-weight:800}@keyframes worker-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body><main id="app" aria-live="polite"></main><div id="toast" class="toast" role="status"></div>
<script src="../js/runtime-config.js"></script><script type="module" src="./worker.js?v=worker-v33"></script>
</body></html>
