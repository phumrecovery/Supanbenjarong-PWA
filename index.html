<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8b4b1f">
  <meta name="description" content="ระบบจัดการร้านสุพรรณบุรีเบญจรงค์">
  <link rel="manifest" href="./manifest.webmanifest?v=product-v1">
  <link rel="icon" href="./assets/icon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./css/app.css?v=product-v1">
  <link rel="stylesheet" href="./css/pos.css?v=product-v1">
  <link rel="stylesheet" href="./css/product.css?v=product-v1">
  <link rel="stylesheet" href="./css/product-overrides.css?v=product-v2">
  <link rel="stylesheet" href="./css/expense.css?v=expense-v1">
  <title>สุพรรณบุรีเบญจรงค์</title>
</head>
<body>
  <div id="app" class="app-shell">
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar" aria-label="เมนูเพิ่มเติม">
      <div class="sb-header"><div class="sb-shop">🏺 สุพรรณบุรีเบญจรงค์</div><div id="sidebarUser" class="sb-user"></div></div>
      <div class="sb-menu">
        <button class="sb-item" data-sidebar-route="claim"><span class="sb-icon">🔄</span><span>รับคืน/เคลม</span></button>
        <button class="sb-item" data-sidebar-route="barcode"><span class="sb-icon">▥</span><span>พิมพ์ Barcode</span></button>
        <button class="sb-item" data-sidebar-route="receipt"><span class="sb-icon">🧾</span><span>พิมพ์/ยกเลิก ใบเสร็จย้อนหลัง</span></button>
        <button class="sb-item" data-sidebar-route="stocktake"><span class="sb-icon">📋</span><span>ตรวจนับสต๊อก</span></button>
        <div class="sb-divider"></div>
        <button class="sb-item" data-sidebar-route="refresh"><span class="sb-icon">🔄</span><span>รีเฟรชข้อมูล</span></button>
      </div>
      <div class="sb-footer"><button id="logout" class="sb-item danger" type="button"><span class="sb-icon">🚪</span><span>ออกจากระบบ</span></button></div>
    </aside>
    <header id="appHeader" class="app-header" hidden>
      <div class="header-left"><button id="menuToggle" class="menu-toggle" type="button" aria-label="เปิดเมนู">☰</button><div class="brand"><img id="topbarLogo" src="https://lh3.googleusercontent.com/d/18rwkqytClqwNtg0PReV1ILLFwkiIKa01" alt=""><span id="topbarTitle">สุพรรณบุรีเบญจรงค์</span></div></div>
      <div class="header-right"><span id="currentDate" class="header-date"></span><span id="connection" class="connection" aria-live="polite"></span></div>
    </header>
    <main id="main" class="main" aria-live="polite"></main>
    <!-- Floating actions live outside page content so they stay pinned to the viewport. -->
    <div id="floatingLayer" class="floating-layer" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="./js/app.js?v=expense-v2"></script>
</body>
</html>
