  <style>.sb-item:hover,.sb-item:focus-visible{background:#f7e9dc;color:var(--primary-dark);outline:0;box-shadow:inset 4px 0 0 var(--primary)}.sb-item:active,.sb-item.pressed{background:#ecd3bf;color:var(--primary-dark);transform:scale(.985);box-shadow:inset 4px 0 0 var(--primary-dark)}.pwa-claim-method{grid-template-columns:1fr!important;background:transparent!important;border:0!important;padding:0!important}.pwa-claim-method button{min-height:56px;border:2px solid var(--border)!important;background:#fff!important;text-align:left;padding:12px 16px!important;font-size:16px!important}.pwa-claim-method button.active{border-color:var(--primary-dark)!important;background:#f7e9dc!important;box-shadow:inset 4px 0 0 var(--primary-dark)}.pwa-claim-method button.active.refund{border-color:#b42318!important;background:#fff1f0!important;box-shadow:inset 4px 0 0 #b42318}.pwa-claim-modal .pwa-claim-list-btn b{font-size:16px}.pwa-claim-modal .pwa-claim-list-btn small{font-size:14px;line-height:1.55}</style>
  <style>.pwa-claim-price{font-size:18px;color:var(--primary-dark)}.pwa-claim-top{position:sticky;top:0;z-index:90;box-sizing:border-box;width:100vw;display:flex;align-items:center;gap:12px;min-height:58px;margin:0 calc(50% - 50vw) 14px;padding:10px max(14px,calc((100vw - 1140px)/2 + 16px));background:var(--bg-card);border-bottom:3px solid var(--primary);box-shadow:0 1px 3px rgba(139,69,19,.10)}.pwa-claim-top h1{margin:0;color:var(--primary-dark);font-size:var(--text-lg);font-weight:600}.pwa-claim-top .pwa-claim-back{padding:7px 11px;border:2px solid var(--border);border-radius:var(--radius);background:var(--bg-card);color:var(--primary-dark);font:700 var(--text-sm) var(--font)}.pwa-claim-top .pwa-claim-back:active{background:var(--primary-light)}.pwa-claim-method-title{margin:18px 0 8px!important;color:var(--primary-dark);font-size:var(--text-sm)}</style>

  <div id="app" class="app-shell">
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

      <div class="sb-header"><div class="sb-shop">🏺 สุพรรณบุรีเบญจรงค์</div><div id="sidebarUser" class="sb-user"></div></div>
      <div class="sb-menu">
        <button class="sb-item" data-sidebar-route="claim"><span class="sb-icon">🔄</span><span>รับคืน/เคลม</span></button>
        <button class="sb-item" data-sidebar-route="barcode"><span class="sb-icon">▥</span><span>พิมพ์ Barcode</span></button>
        <button class="sb-item" data-sidebar-route="receipt"><span class="sb-icon">🧾</span><span>พิมพ์/ยกเลิก ใบเสร็จย้อนหลัง</span></button>
        <button class="sb-item" data-sidebar-route="stocktake"><span class="sb-icon">📋</span><span>ตรวจนับสต๊อก</span></button>
        <div class="sb-divider"></div>
        <button class="sb-item" data-sidebar-route="refresh"><span class="sb-icon">🔄</span><span>รีเฟรชข้อมูล</span></button>
      </div>
      <div class="sb-footer"><button id="logout" class="sb-item danger" type="button"><span class="sb-icon">🚪</span><span>ออกจากระบบ</span></button></div>
    </aside>
    <header id="appHeader" class="app-header" hidden>
      <div class="header-left"><button id="menuToggle" class="menu-toggle" type="button" aria-label="เปิดเมนู">☰</button><div class="brand"><img id="topbarLogo" src="https://lh3.googleusercontent.com/d/18rwkqytClqwNtg0PReV1ILLFwkiIKa01" alt=""><span id="topbarTitle">สุพรรณบุรีเบญจรงค์</span></div></div>
      <div class="header-right"><span id="currentDate" class="header-date"></span><span id="connection" class="connection" aria-live="polite"></span></div>
    </header>
    <main id="main" class="main" aria-live="polite"></main>
    <!-- Floating actions live outside page content so they stay pinned to the viewport. -->
    <div id="floatingLayer" class="floating-layer" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
<script src="./js/runtime-config.js"></script>
